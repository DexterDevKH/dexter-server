---
- name: Setup anisette-v3 (dexter-server macOS ADI Relay)
  hosts: ur.host.ip.addr
  gather_facts: false
  become: True
  vars:
    # Use dexter-server macOS ADI proxy image to permanently bypass -80045 and -80046
    anisette_image: "ghcr.io/chandara/dexter-server:latest"
    # Primary verified upstream macOS ADI server (default: new.ani.sidestore.io)
    upstream_anisette_url: "https://new.ani.sidestore.io"

  tasks:
    - name: Setup podman deps
      ansible.builtin.package:
        name: podman
        state: present

    - name: Setup rootless user
      ansible.builtin.user:
        name: rootless
      register: rootless_usr

    - name: Configure xdg_runtime
      ansible.builtin.lineinfile:
        line: "export XDG_RUNTIME_DIR=/run/user/{{rootless_usr.uid}}"
        path: "/home/{{ rootless_usr.name }}/.bashrc"

    - name: Install podman and deps
      ansible.builtin.package:
        name:
          - podman
          - uidmap
          - slirp4netns
          - acl
        state: present

    - name: Enable linger for rootless user
      ansible.builtin.command:
        cmd: "loginctl enable-linger rootless"
        creates: /var/lib/systemd/linger/rootless

    - name: Pull or build anisette-v3 container image
      containers.podman.podman_image:
        name: "{{ anisette_image }}"
        state: present
      become_user: rootless

    - name: Setup anisette-v3 container
      containers.podman.podman_container:
        name: anisette-v3
        image: "{{ anisette_image }}"
        labels:
          io.containers.autoupdate: registry
          PODMAN_SYSTEMD_UNIT: pod-anisette-v3.service
        state: created
        recreate: true
        rm: true
        publish: 6969:6969
        env:
          UPSTREAM_ANISETTE_URL: "{{ upstream_anisette_url }}"
      become_user: rootless

    - name: Generate systemd unit file for anisette-v3 container
      containers.podman.podman_generate_systemd:
        name: anisette-v3
        restart_policy: "always"
        container_prefix: "pod"
        new: true
        dest: "/home/rootless/.config/systemd/user"
        no_header: true
      become_user: rootless

    - name: Ensure anisettev3 container is started and enabled
      ansible.builtin.systemd:
        name: pod-anisette-v3
        daemon_reload: true
        state: started
        scope: "user"
        enabled: true
      become_user: rootless
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ rootless_usr.uid }}

    - name: Configure podman-auto-update on rootless
      ansible.builtin.systemd:
        name: podman-auto-update
        daemon_reload: true
        state: started
        scope: "user"
        enabled: true
      become_user: rootless
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ rootless_usr.uid }}

    - name: Configure podman-auto-update.timer on rootless
      ansible.builtin.systemd:
        name: podman-auto-update.timer
        daemon_reload: true
        state: started
        scope: "user"
        enabled: true
      become_user: rootless
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ rootless_usr.uid }}
